name: MY AI COMPANY quality checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JSON configuration
        run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]"
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Run SI NATURAL worker tests
        working-directory: workers
        run: |
          npm install --ignore-scripts
          npm test
