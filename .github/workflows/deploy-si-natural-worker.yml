name: Deploy SI NATURAL Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-si-natural-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate private API token
        id: api-token
        shell: bash
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install Worker dependencies
        working-directory: workers
        run: npm install --no-audit --no-fund

      - name: Apply database schema
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute my-ai-company-si-natural --remote --file=schema.sql

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          wranglerVersion: "4"
          command: deploy
          secrets: |
            API_TOKEN
            GEMINI_API_KEY
        env:
          API_TOKEN: ${{ steps.api-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verify live Worker health and agent registry
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://my-ai-company-si-natural.youssefabdelfattah43.workers.dev"
          curl --fail --silent --show-error "$BASE/health" | jq -e '.status == "ok"'
          curl --fail --silent --show-error "$BASE/api/si_natural/agents" | jq -e '.agents | length == 5'
