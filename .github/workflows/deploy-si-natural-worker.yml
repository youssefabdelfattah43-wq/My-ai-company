name: Deploy SI NATURAL Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate private API token
        id: api-token
        shell: bash
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install Worker dependencies
        working-directory: workers
        run: npm install --no-audit --no-fund

      - name: Apply database schema and deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          wranglerVersion: "4"
          preCommands: npx wrangler d1 execute my-ai-company-si-natural --remote --file=./schema.sql
          command: deploy
          secrets: |
            API_TOKEN
            GEMINI_API_KEY
        env:
          API_TOKEN: ${{ steps.api-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
