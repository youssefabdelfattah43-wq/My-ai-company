<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="MY AI COMPANY unified CEO dashboard prototype">
  <title>MY AI COMPANY | CEO HQ</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="MY AI COMPANY home">
        <span class="brand-mark">M</span><span><strong>MY AI COMPANY</strong><small>CEO COMMAND CENTER</small></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <label class="switch-label" for="business-switch">Business workspace</label>
      <select id="business-switch" class="business-switch">
        <option value="si_natural">SI NATURAL</option>
        <option value="paymob_crm">PAYMOB CRM</option>
      </select>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-link active" data-view="overview"><span>▦</span> Overview</button>
        <button class="nav-link" data-view="agents"><span>✳</span> AI Agents</button>
        <button class="nav-link" data-view="tasks"><span>☷</span> Tasks</button>
        <button class="nav-link" data-view="approvals"><span>✓</span> Approvals <i class="nav-count">2</i></button>
        <button class="nav-link" data-view="reports"><span>▤</span> Reports</button>
        <button class="nav-link" data-view="integrations"><span>⌘</span> Integrations</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="profile"><div class="avatar">CEO</div><div><strong>CEO Workspace</strong><small>Administrator preview</small></div></div>
        <div class="prototype-note">Prototype mode · Sample data only</div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Toggle navigation">☰</button>
        <div><div class="eyebrow">MY AI COMPANY / <span id="crumb">OVERVIEW</span></div><h1 id="page-title">Good morning, CEO</h1></div>
        <div class="top-actions"><span class="system-status"><i></i> UI prototype</span><button class="icon-button" title="Notifications" aria-label="Notifications">♧</button></div>
      </header>
      <section class="content" id="view-root" aria-live="polite"></section>
      <footer>MY AI COMPANY <span>·</span> Unified workspace <span>·</span> Not connected to live business data</footer>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
